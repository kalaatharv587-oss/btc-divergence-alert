name: BTC RSI Divergence Alert

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed so the run can save state.json (remembers sent alerts)

concurrency:
  group: divergence-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for divergence and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python divergence_alert.py

      - name: Save state
        run: |
          git config user.name "divergence-bot"
          git config user.email "divergence-bot@users.noreply.github.com"
          git add state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase
            git push
          fi
